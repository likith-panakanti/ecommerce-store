<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernwick | Houseplants and pots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Fernwick</a>
    <button id="open-cart" class="cart-btn" aria-label="Open cart">Cart <span id="cart-count">0</span></button>
  </header>

  <main>
    <section class="hero">
      <h1>Plants that survive your apartment.</h1>
      <p>Hand-picked houseplants and pots, delivered in 3 to 5 days.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search plants" aria-label="Search plants">
        <div id="filters" class="chips" role="group" aria-label="Filter by category"></div>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <aside id="cart" class="cart" aria-hidden="true">
    <div class="cart-head">
      <h2>Your cart</h2>
      <button id="close-cart" class="plain" aria-label="Close cart">Close</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-foot">
      <div class="total"><span>Total</span><strong id="cart-total">$0.00</strong></div>
      <button id="checkout" class="primary">Check out</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <dialog id="checkout-dialog">
    <form id="checkout-form" method="dialog">
      <h2>Delivery details</h2>
      <label>Full name <input name="name" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Delivery address <textarea name="address" rows="3" required autocomplete="street-address"></textarea></label>
      <p id="form-error" class="error" role="alert"></p>
      <div class="row">
        <button type="button" id="cancel-checkout" class="plain">Back to cart</button>
        <button type="submit" class="primary">Place order</button>
      </div>
    </form>
  </dialog>

  <dialog id="done-dialog">
    <h2>Order placed</h2>
    <p id="done-text"></p>
    <button id="done-close" class="primary">Keep shopping</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
